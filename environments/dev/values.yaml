# dev: deployed by ArgoCD into namespace "shopflow-dev".
#
# The image tags below are updated AUTOMATICALLY by shopflow-app's CI pipeline after
# every successful build on main (a commit "dev: deploy shopflow-app@<sha>"), so dev
# always runs the latest tested code. Don't edit the tags by hand.
#
# New platform features are switched on here first; prod gets them through a PR.
imagePullPolicy: IfNotPresent

monitoring:
  enabled: true             # ServiceMonitor + alert rules
networkPolicies:
  enabled: true             # pod-to-pod firewall

# Passwords encrypted for this namespace only (scripts/seal-credentials.sh shopflow-dev)
sealedSecrets:
  enabled: true
  encryptedData:
    postgres-password: 
    rabbitmq-password: 

services:
  orders-api:
    image:
      repository: ghcr.io/chaithanyareddyk3273/shopflow-orders-api
      tag: sha-f71e828
    autoscaling:
      enabled: true
      minReplicas: 1
      maxReplicas: 3
    canary:
      enabled: true         # new versions go out as a canary, rolled back if errors rise
  inventory-svc:
    image:
      repository: ghcr.io/chaithanyareddyk3273/shopflow-inventory-svc
      tag: sha-f71e828
    autoscaling:
      enabled: true
      minReplicas: 1
      maxReplicas: 3
  notifier:
    replicas: 1
    image:
      repository: ghcr.io/chaithanyareddyk3273/shopflow-notifier
      tag: sha-f71e828

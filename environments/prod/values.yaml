# prod: deployed by ArgoCD into namespace "shopflow-prod".
#
# Image tags change ONLY through a pull request opened by the "Promote dev → prod"
# workflow (Actions tab). It copies the tags currently running in dev; merging the PR
# is the production deployment, and reverting it is the rollback.
imagePullPolicy: IfNotPresent

monitoring:
  enabled: true             # ServiceMonitor + alert rules
networkPolicies:
  enabled: true             # pod-to-pod firewall

# Passwords encrypted for this namespace only (scripts/seal-credentials.sh shopflow-prod)
sealedSecrets:
  enabled: true
  encryptedData:
    postgres-password: 
    rabbitmq-password: 

services:
  orders-api:
    image:
      repository: ghcr.io/chaithanyareddyk3273/shopflow-orders-api
      tag: sha-5093c1c
    autoscaling:
      enabled: true
      minReplicas: 2        # never fewer than 2: one pod can fail with no downtime
      maxReplicas: 5
    canary:
      enabled: true         # new versions go out as a canary, rolled back if errors rise
  inventory-svc:
    image:
      repository: ghcr.io/chaithanyareddyk3273/shopflow-inventory-svc
      tag: sha-5093c1c
    autoscaling:
      enabled: true
      minReplicas: 2
      maxReplicas: 5
  notifier:
    replicas: 1             # one consumer is plenty; RabbitMQ queues the work
    image:
      repository: ghcr.io/chaithanyareddyk3273/shopflow-notifier
      tag: sha-5093c1c

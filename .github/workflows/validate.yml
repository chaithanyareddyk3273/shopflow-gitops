# Checks every change BEFORE it can reach a cluster: since ArgoCD deploys whatever is
# on main, a broken chart merged here would break dev/prod. Runs on every PR and push.
name: Validate

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  KUBECONFORM_VERSION: v0.8.0
  # Schemas for custom resources (Argo, Prometheus Operator, Sealed Secrets) come from
  # the community CRD catalog; built-in kinds use Kubernetes' own schemas.
  CRD_SCHEMAS: https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json

jobs:
  chart:
    name: Chart (${{ matrix.environment }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # all-features = chart/ci/all-features-values.yaml: every optional feature on,
        # so a broken template is caught before any environment enables it
        environment: [local, dev, prod, all-features]
    steps:
      - uses: actions/checkout@v4

      - uses: azure/setup-helm@v4

      - name: Install kubeconform
        run: |
          curl -sSL "https://github.com/yannh/kubeconform/releases/download/${KUBECONFORM_VERSION}/kubeconform-linux-amd64.tar.gz" \
            | tar xz -C /usr/local/bin kubeconform

      - name: Pick the values file
        id: values
        run: |
          if [ "${{ matrix.environment }}" = "all-features" ]; then
            echo "file=charts/shopflow/ci/all-features-values.yaml" >> "$GITHUB_OUTPUT"
          else
            echo "file=environments/${{ matrix.environment }}/values.yaml" >> "$GITHUB_OUTPUT"
          fi

      - name: Helm lint
        run: helm lint charts/shopflow -f ${{ steps.values.outputs.file }}

      - name: Render and validate against the Kubernetes schemas
        run: |
          helm template shopflow charts/shopflow -f ${{ steps.values.outputs.file }} \
            | kubeconform -strict -summary -schema-location default -schema-location "$CRD_SCHEMAS" -

  argocd:
    name: ArgoCD manifests + dashboards
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install kubeconform
        run: |
          curl -sSL "https://github.com/yannh/kubeconform/releases/download/${KUBECONFORM_VERSION}/kubeconform-linux-amd64.tar.gz" \
            | tar xz -C /usr/local/bin kubeconform

      - name: Validate Applications
        run: kubeconform -strict -summary -schema-location default -schema-location "$CRD_SCHEMAS" argocd/

      - name: Validate dashboards (kustomize build + JSON check)
        run: |
          kubectl kustomize platform/dashboards | kubeconform -strict -summary -
          for f in platform/dashboards/*.json; do jq empty "$f" && echo "valid JSON: $f"; done

# Checks every change BEFORE it can reach a cluster: since ArgoCD deploys whatever is
# on main, a broken chart merged here would break dev/prod. Runs on every PR and push.
name: Validate

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  KUBECONFORM_VERSION: v0.8.0

jobs:
  chart:
    name: Chart (${{ matrix.environment }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        environment: [local, dev, prod]
    steps:
      - uses: actions/checkout@v4

      - uses: azure/setup-helm@v4

      - name: Install kubeconform
        run: |
          curl -sSL "https://github.com/yannh/kubeconform/releases/download/${KUBECONFORM_VERSION}/kubeconform-linux-amd64.tar.gz" \
            | tar xz -C /usr/local/bin kubeconform

      - name: Helm lint
        run: helm lint charts/shopflow -f environments/${{ matrix.environment }}/values.yaml

      - name: Render and validate against the Kubernetes schema
        run: |
          helm template shopflow charts/shopflow -f environments/${{ matrix.environment }}/values.yaml \
            | kubeconform -strict -summary -

  argocd:
    name: ArgoCD manifests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install kubeconform
        run: |
          curl -sSL "https://github.com/yannh/kubeconform/releases/download/${KUBECONFORM_VERSION}/kubeconform-linux-amd64.tar.gz" \
            | tar xz -C /usr/local/bin kubeconform

      # ArgoCD's Application is a custom resource, so its schema comes from the community CRD catalog
      - name: Validate Applications
        run: |
          kubeconform -strict -summary \
            -schema-location default \
            -schema-location 'https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json' \
            argocd/

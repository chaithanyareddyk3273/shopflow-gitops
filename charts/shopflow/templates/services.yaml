{{- /*
One Deployment + one Service for EACH microservice listed under `services:` in values.yaml.
`range` is a loop: $name is e.g. "orders-api", $svc is that service's settings.
Adding a new microservice = adding an entry in values.yaml, no new template needed.
*/ -}}
{{- range $name, $svc := .Values.services }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}
  labels:
    {{- include "shopflow.labels" (dict "root" $ "name" $name) | nindent 4 }}
spec:
  replicas: {{ $svc.replicas }}       # how many copies (pods) to keep running
  revisionHistoryLimit: 3                # keep 3 old versions for `kubectl rollout undo`
  # Which pods belong to this Deployment (must match the pod labels below; never change it)
  selector:
    matchLabels:
      {{- include "shopflow.selectorLabels" (dict "root" $ "name" $name) | nindent 6 }}
  # The pod template: what every pod of this service looks like
  template:
    metadata:
      labels:
        {{- include "shopflow.selectorLabels" (dict "root" $ "name" $name) | nindent 8 }}
      annotations:
        # Tell Prometheus to collect metrics from this pod's /metrics endpoint
        prometheus.io/scrape: "true"
        prometheus.io/port: "8000"
        prometheus.io/path: /metrics
        # Roll pods automatically when credentials change
        checksum/credentials: {{ include (print $.Template.BasePath "/secrets.yaml") $ | sha256sum }}
    spec:
      # The app never calls the Kubernetes API, so don't give it API credentials
      automountServiceAccountToken: false
      # Pod-level security: never run as root (the Dockerfile creates user 10001)
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: {{ $name }}
          image: "{{ $svc.image.repository }}:{{ $svc.image.tag }}"   # repository:tag from the values files
          imagePullPolicy: {{ $.Values.imagePullPolicy }}
          ports:
            - name: http
              containerPort: 8000
          env:
            {{- if $svc.database }}
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: shopflow-credentials
                  key: postgres-password
            # $(VAR) is expanded by Kubernetes from the env var defined above
            - name: DATABASE_URL
              value: "postgresql://{{ $.Values.postgres.user }}:$(POSTGRES_PASSWORD)@postgres:5432/{{ $svc.database }}"
            {{- end }}
            {{- if $svc.rabbitmq }}
            - name: RABBITMQ_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: shopflow-credentials
                  key: rabbitmq-password
            - name: RABBITMQ_URL
              value: "amqp://{{ $.Values.rabbitmq.user }}:$(RABBITMQ_PASSWORD)@rabbitmq:5672/%2F"
            {{- end }}
            {{- range $key, $value := $svc.env }}
            - name: {{ $key }}
              value: {{ $value | quote }}
            {{- end }}
          # Allow up to 2 min for first start (services wait for Postgres before serving)
          startupProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 2
            failureThreshold: 60
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 5
            failureThreshold: 3
          # requests = what the scheduler reserves for the pod; limits = the most it may use
          resources:
            {{- toYaml $svc.resources | nindent 12 }}
          # Container-level security: read-only filesystem, no extra Linux privileges
          securityContext:
            {{- include "shopflow.containerSecurityContext" $ | nindent 12 }}
          # The filesystem is read-only, so give the app a small writable /tmp
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
---
# A Service gives the pods one stable name and address, e.g. http://orders-api:8000,
# and spreads requests across all pods of the Deployment
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}
  labels:
    {{- include "shopflow.labels" (dict "root" $ "name" $name) | nindent 4 }}
spec:
  selector:
    {{- include "shopflow.selectorLabels" (dict "root" $ "name" $name) | nindent 4 }}
  ports:
    - name: http
      port: 8000
      targetPort: http
{{- end }}

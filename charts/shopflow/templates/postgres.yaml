{{- /*
Single-instance Postgres for dev/demo. One server, one database per service.
For production this would be Amazon RDS (or an operator such as CloudNativePG).
*/ -}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: postgres-init
  labels:
    {{- include "shopflow.labels" (dict "root" $ "name" "postgres") | nindent 4 }}
data:
  init.sql: |
    {{- range $name, $svc := .Values.services }}
    {{- if $svc.database }}
    CREATE DATABASE {{ $svc.database }};
    {{- end }}
    {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  labels:
    {{- include "shopflow.labels" (dict "root" $ "name" "postgres") | nindent 4 }}
spec:
  clusterIP: None  # headless: stable DNS for the StatefulSet pod
  selector:
    {{- include "shopflow.selectorLabels" (dict "root" $ "name" "postgres") | nindent 4 }}
  ports:
    - name: postgres
      port: 5432
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  labels:
    {{- include "shopflow.labels" (dict "root" $ "name" "postgres") | nindent 4 }}
spec:
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels:
      {{- include "shopflow.selectorLabels" (dict "root" $ "name" "postgres") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "shopflow.selectorLabels" (dict "root" $ "name" "postgres") | nindent 8 }}
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 70   # "postgres" user in the alpine image
        runAsGroup: 70
        fsGroup: 70
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: postgres
          image: {{ .Values.postgres.image }}
          ports:
            - name: postgres
              containerPort: 5432
          env:
            - name: POSTGRES_USER
              value: {{ .Values.postgres.user | quote }}
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: shopflow-credentials
                  key: postgres-password
            - name: POSTGRES_DB
              value: shopflow
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", {{ .Values.postgres.user | quote }}]
            periodSeconds: 5
          livenessProbe:
            exec:
              command: ["pg_isready", "-U", {{ .Values.postgres.user | quote }}]
            initialDelaySeconds: 30
            periodSeconds: 10
          resources:
            {{- toYaml .Values.postgres.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
            - name: init
              mountPath: /docker-entrypoint-initdb.d
              readOnly: true
            - name: run
              mountPath: /var/run/postgresql
      volumes:
        - name: init
          configMap:
            name: postgres-init
        - name: run
          emptyDir: {}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: {{ .Values.postgres.storage }}

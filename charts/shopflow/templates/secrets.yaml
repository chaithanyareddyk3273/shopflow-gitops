apiVersion: v1
kind: Secret
metadata:
  name: shopflow-credentials
  labels:
    {{- include "shopflow.labels" (dict "root" $ "name" "credentials") | nindent 4 }}
type: Opaque
stringData:
  postgres-password: {{ required "credentials.postgresPassword is required" .Values.credentials.postgresPassword | quote }}
  rabbitmq-password: {{ required "credentials.rabbitmqPassword is required" .Values.credentials.rabbitmqPassword | quote }}

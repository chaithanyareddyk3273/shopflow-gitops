{{- /*
Database and RabbitMQ passwords.

sealedSecrets.enabled: false -> a plain Secret from credentials.* (local laptop only:
                                the passwords sit in values.yaml in clear text)
sealedSecrets.enabled: true  -> a SealedSecret: the passwords are ENCRYPTED with the
                                cluster's public key (kubeseal), so they're safe in Git.
                                The sealed-secrets controller decrypts them into the
                                same Secret "shopflow-credentials" inside the cluster.
*/ -}}
{{- if .Values.sealedSecrets.enabled }}
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: shopflow-credentials
  labels:
    {{- include "shopflow.labels" (dict "root" $ "name" "credentials") | nindent 4 }}
spec:
  encryptedData:
    postgres-password: {{ required "sealedSecrets.encryptedData.postgres-password is required" (index .Values.sealedSecrets.encryptedData "postgres-password") }}
    rabbitmq-password: {{ required "sealedSecrets.encryptedData.rabbitmq-password is required" (index .Values.sealedSecrets.encryptedData "rabbitmq-password") }}
  template:
    metadata:
      name: shopflow-credentials
      labels:
        {{- include "shopflow.labels" (dict "root" $ "name" "credentials") | nindent 8 }}
    type: Opaque
{{- else }}
apiVersion: v1
kind: Secret
metadata:
  name: shopflow-credentials
  labels:
    {{- include "shopflow.labels" (dict "root" $ "name" "credentials") | nindent 4 }}
type: Opaque
stringData:
  postgres-password: {{ required "credentials.postgresPassword is required" .Values.credentials.postgresPassword | quote }}
  rabbitmq-password: {{ required "credentials.rabbitmqPassword is required" .Values.credentials.rabbitmqPassword | quote }}
{{- end }}

# Platform: metrics-server reports pod CPU/memory to Kubernetes.
# The HorizontalPodAutoscaler needs it to decide when to add or remove pods.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: platform-metrics-server
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://kubernetes-sigs.github.io/metrics-server/
    chart: metrics-server
    targetRevision: 3.14.0
    helm:
      valuesObject:
        args:
          # kind's kubelets use self-signed certificates. Not needed on EKS.
          - --kubelet-insecure-tls
  destination:
    server: https://kubernetes.default.svc
    namespace: kube-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true

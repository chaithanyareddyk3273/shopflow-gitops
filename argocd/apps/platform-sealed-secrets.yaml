# Platform: Sealed Secrets. Passwords are committed to Git ENCRYPTED (a SealedSecret);
# only this controller, inside the cluster, holds the private key that can decrypt them
# into a normal Kubernetes Secret.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: platform-sealed-secrets
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://bitnami.github.io/sealed-secrets
    chart: sealed-secrets
    targetRevision: 2.20.0
    helm:
      valuesObject:
        # The name the kubeseal CLI looks for by default
        fullnameOverride: sealed-secrets-controller
  destination:
    server: https://kubernetes.default.svc
    namespace: kube-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
